<style>
body{background:var(--bg)}
.mh{background:var(--box);height:66px;border-bottom:1px solid var(--line)}
.mh .in{display:flex;align-items:center;height:100%;gap:14px}
.mh .logo{width:150px;height:38px}
.mh .t{font-size:22px;font-weight:400;border-left:1px solid var(--edge);padding-left:14px}
.mh .ic{margin-left:auto;display:flex;gap:22px;align-items:center}
.mh .ic a{position:relative}
.mh .theme{display:flex;align-items:center;gap:8px;font-size:13px;min-height:44px;cursor:pointer}
.mh .ic em{color:var(--on);position:absolute;top:-6px;right:-8px;background:var(--red);font-style:normal;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center}
.sub{background:var(--bg2);height:30px}
.sub .in{display:flex;justify-content:space-between;align-items:center;height:100%}
.sub a{font-size:11px;font-weight:700;color:var(--txt)}
.sub .lg{border:1px solid currentColor;border-radius:12px;padding:2px 12px}
.mp{padding:26px var(--gut) 60px;max-width:1090px}
.alert{background:#a8161c;color:#fff;border-radius:4px;padding:12px 16px;font-weight:500;font-size:15px;text-align:center;line-height:1.45;margin-bottom:20px}
.alert b{font-weight:700}
.alert a{text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
@media(max-width:560px){.mh .ic{gap:14px}.mh .ic a[title="Configurações"]{display:none}.mh .theme .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.mh .in{gap:10px}.mh .logo{width:96px}.mh .t{font-size:16px;padding-left:10px;white-space:nowrap}}
</style>
</head>
